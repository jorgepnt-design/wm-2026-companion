name = "wm-goal-push"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Cron: jede Minute Tore pruefen. Der Worker nutzt dafuer sub:index und kein KV.list(),
# damit das kostenlose Cloudflare-KV-List-Limit nicht taeglich erreicht wird.
[triggers]
crons = ["* * * * *"]

# KV-Namespace fÃ¼r Abos, ausstehende Meldungen und letzte SpielstÃ¤nde.
# Anlegen:  npx wrangler kv namespace create PUSH
# Danach die ausgegebene id hier eintragen:
[[kv_namespaces]]
binding = "PUSH"
id = "a82b204f0b624dd6b33700181450db35"

# Secrets NICHT hier eintragen, sondern setzen mit:
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put VAPID_SUBJECT      # z. B. mailto:jorgepnt@gmail.com
