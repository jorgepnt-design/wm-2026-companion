name = "wm-goal-push"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Cron: jede Minute Tore prüfen (kleinstes Cloudflare-Intervall).
[triggers]
crons = ["* * * * *"]

# KV-Namespace für Abos, ausstehende Meldungen und letzte Spielstände.
# Anlegen:  npx wrangler kv namespace create PUSH
# Danach die ausgegebene id hier eintragen:
[[kv_namespaces]]
binding = "PUSH"
id = "HIER_KV_NAMESPACE_ID_EINTRAGEN"

# Secrets NICHT hier eintragen, sondern setzen mit:
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put VAPID_SUBJECT      # z. B. mailto:jorgepnt@gmail.com
