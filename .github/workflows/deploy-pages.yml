name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Tor-Push: oeffentliche Werte (kein Geheimnis) – damit der GitHub-Pages-Build sie kennt.
          VITE_PUSH_BACKEND_URL: https://wm-goal-push.jorge-ligen.workers.dev
          VITE_VAPID_PUBLIC_KEY: BJYHA0SMOClWlci-tJ8mzyQIvdFYNYAnBnVJBzD99pYAXJJ0m8ERjGxqOg2KsPFvSurmaoj35lwMXSLizUmc-_M

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
